<!doctype html>
<html lang="en" saved-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connections</title>
<!-- The MAP's own graph, served on its own for embedding elsewhere. Nothing here
     reimplements anything: it loads the site's real stylesheet and scripts, puts up
     the same .graph-container markup a note page uses, and lets Quartz mount its
     graph into it. data-slug is what the component reads to decide what to centre
     on, so this page IS the Disco note as far as the graph is concerned. Behaviour,
     physics, hover, drag and colours are therefore identical to the sidebar's — and
     it follows the MAP automatically as the MAP changes. -->
<link rel="stylesheet" href="../index.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}
  .graph{margin:0;height:100%;width:100%;max-width:none}
  /* the sidebar sizes its panel; an embed fills whatever frame it is given */
  .graph > .graph-outer{height:100%!important;width:100%!important;max-width:none;margin:0;border:0;border-radius:0;background:transparent}
  .graph-container{width:100%!important;height:100%!important}
  .graph h3,.graph .graph-heading{display:none}
  /* the sidebar's own "open the full graph" button — the host page has its own */
  .global-graph-icon{display:none!important}
</style>
<script>
  /* the theme is read from storage before paint; an embed is always dark */
  try {
    localStorage.setItem("theme", "dark")
    /* Rest the neighbours' names low so the note at the centre reads first —
       they come up on zoom and hover exactly as they do on the MAP. */
    localStorage.setItem("graph-label-density", "22")
  } catch (e) {}
  document.documentElement.setAttribute("saved-theme", "dark")
</script>
</head>
<body data-slug="MUSIC/GENRES/DANCE/Disco">
  <div class="graph">
    <div class="graph-outer">
      <!-- The MAP's own knobs, opened up: a sidebar panel is read at arm's length,
           this circle is read at a glance, so the nodes need more air between them
           than the default 30 gives. Nothing else differs from the sidebar graph. -->
      <div class="graph-container" data-cfg='{"drag":true,"zoom":true,"depth":1,"scale":0.5,"repelForce":1.05,"centerForce":0.34,"linkDistance":52,"fontSize":0.26,"opacityScale":1,"showTags":false,"removeTags":[],"focusOnHover":false,"enableRadial":false}'></div>
    </div>
  </div>
  <!-- Quartz injects this global on every page it renders; the graph reads the
       index through it, so an embed page has to declare it the same way. -->
  <script>const fetchData = fetch("./graphIndex.json").then(data => data.json())</script>
  <script src="../prescript.js"></script>
  <script src="../postscript.js" type="module"></script>
  <script>
    /* Sizing and re-rendering are driven by the HOST page, which knows the real
       box (see fit() there). This page deliberately does NOT also watch its own
       size: two overlapping nav dispatches each append their own canvas, and you
       end up looking at two graphs stacked on one another. One driver only. */

    /* The graph opens notes with spaNavigate. Inside an embed that would replace
       the frame with a whole page, so route it to a new tab instead and leave the
       graph itself untouched — no fork of the MAP's code. */
    /* postscript.js is a module, so it runs AFTER this classic script and its
       router assigns its own spaNavigate over ours — which is why clicks were
       still going through Quartz's SPA and landing on a bare 404. Install ours
       as an accessor that ignores later assignment, so load order stops
       mattering. */
    const openInTab = (url) => {
      /* The graph builds note links RELATIVE to the note it is centred on — three
         levels deep for MUSIC/GENRES/DANCE/Disco. This page sits at /map/static/,
         only one level deep, so those "../../.." climbed past /map/ to the site
         root and landed on a bare 404. Re-anchor the path inside the MAP. */
      const i = url.pathname.indexOf("/MUSIC/")
      const href = i >= 0 ? "/map" + url.pathname.slice(i) : url.toString()
      window.open(href, "_blank", "noopener")
    }
    Object.defineProperty(window, "spaNavigate", {
      configurable: false,
      get: () => openInTab,
      set: () => {},
    })
  </script>
</body>
</html>
